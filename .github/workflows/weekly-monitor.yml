name: Weekly Flight Monitor (Slow Routes)

# 低频调度：仅执行 config.yaml 中 group: weekly 的慢路由（如 PQC 富国岛）。
# 这些路由在 GitHub 云 IP 上 Trip.com 常超时/无结果，已降 max_retries 与
# timeout_seconds，但单次仍较慢，故拆到每周一次，避免拖慢每日那霸(OKA)监控。

on:
  schedule:
    - cron: '0 18 * * 1'  # 每周一 02:00 (UTC+8)
  workflow_dispatch:

jobs:
  run-weekly-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install chromium

      - name: Run tests
        run: |
          python -m pytest tests/ -q

      - name: Run weekly search tasks
        timeout-minutes: 20
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          echo "加载配置文件中 $(python -c "
          import yaml
          with open('config.yaml') as f:
              tasks = yaml.safe_load(f).get('tasks', [])
          print(len([t for t in tasks if (t.get('group') or 'daily') == 'weekly']))
          ") 个 weekly 分组任务"
          python main.py run-tasks --group weekly

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-scrape-debug
          path: data/trip_debug_snapshots/
          if-no-files-found: ignore
