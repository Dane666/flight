name: Nightly Flight Monitor (Daily)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 17 * * *'  # 每天凌晨 01:00 (UTC+8)
  workflow_dispatch:

jobs:
  run-all-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install chromium

      - name: Run tests
        run: |
          python -m pytest tests/ -q

      - name: Run daily search tasks
        timeout-minutes: 15
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          echo "加载配置文件中 $(python -c "
          import yaml
          with open('config.yaml') as f:
              tasks = yaml.safe_load(f).get('tasks', [])
          print(len([t for t in tasks if (t.get('group') or 'daily') == 'daily']))
          ") 个 daily 分组任务"
          python main.py run-tasks --group daily

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-scrape-debug
          path: data/trip_debug_snapshots/
          if-no-files-found: ignore
