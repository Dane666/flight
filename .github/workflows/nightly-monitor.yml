name: Nightly Flight Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * 1-5' # 工作日 09:00 (UTC+8)
    - cron: '0 10 * * 1-5' # 工作日 18:00 (UTC+8)
    - cron: '0 2 * * 0,6' # 周末 10:00 (UTC+8)
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install chromium

      - name: Build config.yaml from secrets
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python main.py init-config --force
          echo "Generated default config.yaml"

          python - <<'PY'
          from pathlib import Path
          import os, yaml

          path = Path("config.yaml")
          obj = yaml.safe_load(path.read_text(encoding="utf-8"))
          if isinstance(obj, str):
              obj = yaml.safe_load(obj)

          feishu_webhook = os.getenv("FEISHU_WEBHOOK_URL")
          feishu_secret = os.getenv("FEISHU_SECRET")

          obj["provider"] = "trip_scrape"
          obj["currency"] = obj.get("currency", "CNY")
          obj["trip_scrape_timeout_seconds"] = int(
              obj.get("trip_scrape_timeout_seconds", 60)
          )
          obj["notifier"] = "feishu" if feishu_webhook else "console"
          obj["feishu_webhook_url"] = feishu_webhook
          obj["feishu_secret"] = feishu_secret
          obj["thailand_destinations"] = ["BKK", "DMK", "HKT"]
          obj["origins"] = obj.get("origins", ["HKG"])

          path.write_text(
              yaml.safe_dump(obj, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          print(f"config.yaml ready, provider={obj.get('provider')}")
          PY

      # 中秋节 前后一天
      - name: Search Mid-Autumn
        env:
          TRIP_SCRAPE_DEBUG_DIR: artifacts/trip-scrape-mid-autumn
        run: |
          python main.py search \
            --origin HKG --destination PQC \
            --depart-date 2026-09-24 --return-date 2026-09-27 \
            --window-days 1 --label "中秋"

      # 国庆节 前后一天
      - name: Search National Day
        env:
          TRIP_SCRAPE_DEBUG_DIR: artifacts/trip-scrape-national-day
        run: |
          python main.py search \
            --origin HKG --destination PQC \
            --depart-date 2026-10-01 --return-date 2026-10-07 \
            --window-days 1 --label "国庆"

      # 中秋+国庆桥 请假3天 0924-1007 (window=1 减少查询对数)
      - name: Search Mid-Autumn & National Day Bridge
        env:
          TRIP_SCRAPE_DEBUG_DIR: artifacts/trip-scrape-bridge
        run: |
          python main.py search \
            --origin HKG --destination PQC \
            --depart-date 2026-09-25 --return-date 2026-10-07 \
            --window-days 1 --label "中秋国庆桥-请假3天"

      # 春节 前后一两天 (window=1 加速)
      - name: Search Spring Festival
        env:
          TRIP_SCRAPE_DEBUG_DIR: artifacts/trip-scrape-spring
        run: |
          python main.py search \
            --origin HKG --destination PQC \
            --depart-date 2027-02-15 --return-date 2027-02-22 \
            --window-days 1 --label "春节"

      # 春节特价 0207-0210 (window=1 加速)
      - name: Search Spring Festival Deal
        env:
          TRIP_SCRAPE_DEBUG_DIR: artifacts/trip-scrape-spring-deal
        run: |
          python main.py search \
            --origin HKG --destination PQC \
            --depart-date 2027-02-07 --return-date 2027-02-10 \
            --window-days 1 --label "春节特价"

      - name: Upload Trip scrape debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-scrape-debug
          path: artifacts/trip-scrape-*
          if-no-files-found: ignore
