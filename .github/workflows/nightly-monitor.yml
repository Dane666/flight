name: Nightly Flight Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * 1-5' # 工作日 09:00 (UTC+8)
    - cron: '0 10 * * 1-5' # 工作日 18:00 (UTC+8)
    - cron: '0 2 * * 0,6' # 周末 10:00 (UTC+8)
  workflow_dispatch:

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 中秋
            depart: 2026-09-24
            return: 2026-09-27
            window: 1
            min_trip: 0
          - label: 国庆
            depart: 2026-10-01
            return: 2026-10-07
            window: 1
            min_trip: 0
          - label: 中秋国庆桥-请假3天
            depart: 2026-09-25
            return: 2026-10-07
            window: 1
            min_trip: 5
          - label: 春节
            depart: 2027-02-15
            return: 2027-02-22
            window: 1
            min_trip: 0
          - label: 春节特价
            depart: 2027-02-07
            return: 2027-02-10
            window: 1
            min_trip: 0

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install chromium

      - name: Build config.yaml from secrets
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python main.py init-config --force

          python - <<'PY'
          from pathlib import Path
          import os, yaml

          path = Path("config.yaml")
          obj = yaml.safe_load(path.read_text(encoding="utf-8"))
          if isinstance(obj, str):
              obj = yaml.safe_load(obj)

          feishu_webhook = os.getenv("FEISHU_WEBHOOK_URL")
          feishu_secret = os.getenv("FEISHU_SECRET")

          obj["provider"] = "trip_scrape"
          obj["currency"] = obj.get("currency", "CNY")
          obj["trip_scrape_timeout_seconds"] = 60
          obj["notifier"] = "feishu" if feishu_webhook else "console"
          obj["feishu_webhook_url"] = feishu_webhook
          obj["feishu_secret"] = feishu_secret
          obj["thailand_destinations"] = ["BKK", "DMK", "HKT"]
          obj["origins"] = ["HKG"]

          path.write_text(
              yaml.safe_dump(obj, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          print(f"config.yaml ready, provider={obj.get('provider')}")
          PY

      - name: Search ${{ matrix.label }}
        env:
          TRIP_SCRAPE_DEBUG_DIR: artifacts/trip-scrape-${{ matrix.label }}
        run: |
          python main.py search \
            --origin HKG --destination PQC \
            --depart-date ${{ matrix.depart }} --return-date ${{ matrix.return }} \
            --window-days ${{ matrix.window }} --label "${{ matrix.label }}" \
            --min-trip-days ${{ matrix.min_trip }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trip-scrape-${{ matrix.label }}
          path: artifacts/trip-scrape-${{ matrix.label }}
          if-no-files-found: ignore
