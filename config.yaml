# ============================================================
# 机票价格监控 — 主配置文件
# ============================================================
# 使用方法：
#   - 添加搜索任务：在下方 tasks 列表中添加新条目
#   - 修改目的地/日期：直接编辑对应 task
#   - GitHub Actions 定时：workflow 会自动执行配置中所有 task
# ============================================================

# ── 全局设置 ──
provider: trip_scrape
currency: CNY
trip_scrape_timeout_seconds: 60
trip_scrape_max_retries: 3
interval_minutes: 30
alert_threshold: 2200
alert_cooldown_minutes: 180
notifier: bark
bark_device_key: null
db_path: data/flight_prices.db
festival: dragon_boat

# ── 默认搜索参数（run-once / run 命令使用）──
origins:
  - HKG
destination: PQC
thailand_destinations:
  - BKK
  - DMK
  - HKT
window_start: '2026-06-17'
window_end: '2026-06-22'
fixed_depart_date: null
fixed_return_date: null
min_depart_time: null
min_trip_days: 4
max_trip_span_days: 6
max_leave_workdays: 3

# ── 邮件通知（未启用）──
smtp_host: null
smtp_port: 587
smtp_username: null
smtp_password: null
smtp_use_tls: true
email_from: null
email_to: []

# ============================================================
# 定时搜索任务列表
# 每个任务对应一次完整的多目的地机票搜索
# GitHub Actions 执行 run-tasks 时会依次执行所有任务
# ============================================================
tasks:
  # ── 那霸 (OKA) ──
  - name: "中秋那霸-广州"
    origin: CAN
    destination: OKA
    depart_date: "2026-09-24"
    return_date: "2026-09-27"
    window_days: 0
    min_trip_days: 3
    no_thailand: true

  - name: "香港那霸0924-0927"
    origin: HKG
    destination: OKA
    depart_date: "2026-09-24"
    return_date: "2026-09-27"
    window_days: 0
    min_trip_days: 3
    no_thailand: true

  # ── 富国岛 (PQC) 11月初 ──
  - name: "PQC-11月初-CAN"
    origin: CAN
    destination: PQC
    depart_date: "2026-11-06"
    return_date: "2026-11-09"
    window_days: 1
    min_trip_days: 3
    max_retries: 1
    timeout_seconds: 30
    group: weekly

  - name: "PQC-11月初-HKG"
    origin: HKG
    destination: PQC
    depart_date: "2026-11-06"
    return_date: "2026-11-09"
    window_days: 1
    min_trip_days: 3
    max_retries: 1
    timeout_seconds: 30
    group: weekly

  # ── 富国岛 (PQC) 圣诞 ──
  - name: "PQC-圣诞-CAN"
    origin: CAN
    destination: PQC
    depart_date: "2026-12-24"
    return_date: "2026-12-27"
    window_days: 1
    min_trip_days: 3
    max_retries: 1
    timeout_seconds: 30
    group: weekly

  - name: "PQC-圣诞-HKG"
    origin: HKG
    destination: PQC
    depart_date: "2026-12-24"
    return_date: "2026-12-27"
    window_days: 1
    min_trip_days: 3
    max_retries: 1
    timeout_seconds: 30
    group: weekly

  # ── 富国岛 (PQC) 元旦 ──
  - name: "PQC-元旦-CAN"
    origin: CAN
    destination: PQC
    depart_date: "2027-01-01"
    return_date: "2027-01-04"
    window_days: 1
    min_trip_days: 3
    max_retries: 1
    timeout_seconds: 30
    group: weekly

  - name: "PQC-元旦-HKG"
    origin: HKG
    destination: PQC
    depart_date: "2027-01-01"
    return_date: "2027-01-04"
    window_days: 1
    min_trip_days: 3
    max_retries: 1
    timeout_seconds: 30
    group: weekly

  # ── 富国岛 (PQC) 年前 ──
  - name: "PQC-年前-CAN"
    origin: CAN
    destination: PQC
    depart_date: "2027-01-22"
    return_date: "2027-01-25"
    window_days: 1
    min_trip_days: 3
    max_retries: 1
    timeout_seconds: 30
    group: weekly

  - name: "PQC-年前-HKG"
    origin: HKG
    destination: PQC
    depart_date: "2027-01-22"
    return_date: "2027-01-25"
    window_days: 1
    min_trip_days: 3
    max_retries: 1
    timeout_seconds: 30
    group: weekly

  # ── 北海道 (CTS 新千岁/札幌) 区间扫描 ──
  # 香港往返北海道，11月~次年3月，行程 4~5 天且含双休。
  # 按月拆成 5 个任务（group: hokkaido），可单独跑某月：
  #   python main.py run-tasks --group hokkaido --task "北海道-12月"
  # scan_start/scan_end 约束出发日窗口（按月不重叠）；max_return_date 比月末
  # 多 5 天，允许跨月行程的回程溢出到下月初，同时不把下月出发日纳入窗口。
  - name: "北海道-11月-HKG"
    origin: HKG
    destination: CTS
    depart_date: "2026-11-01"
    return_date: "2026-11-30"
    window_days: 0
    min_trip_days: 4
    max_trip_span_days: 5
    require_weekend: true
    no_thailand: true
    group: hokkaido
    scan_start: "2026-11-01"
    scan_end: "2026-11-30"
    max_return_date: "2026-12-05"

  - name: "北海道-12月-HKG"
    origin: HKG
    destination: CTS
    depart_date: "2026-12-01"
    return_date: "2026-12-31"
    window_days: 0
    min_trip_days: 4
    max_trip_span_days: 5
    require_weekend: true
    no_thailand: true
    group: hokkaido
    scan_start: "2026-12-01"
    scan_end: "2026-12-31"
    max_return_date: "2027-01-05"

  - name: "北海道-01月-HKG"
    origin: HKG
    destination: CTS
    depart_date: "2027-01-01"
    return_date: "2027-01-31"
    window_days: 0
    min_trip_days: 4
    max_trip_span_days: 5
    require_weekend: true
    no_thailand: true
    group: hokkaido
    scan_start: "2027-01-01"
    scan_end: "2027-01-31"
    max_return_date: "2027-02-05"

  - name: "北海道-02月-HKG"
    origin: HKG
    destination: CTS
    depart_date: "2027-02-01"
    return_date: "2027-02-28"
    window_days: 0
    min_trip_days: 4
    max_trip_span_days: 5
    require_weekend: true
    no_thailand: true
    group: hokkaido
    scan_start: "2027-02-01"
    scan_end: "2027-02-28"
    max_return_date: "2027-03-05"

  - name: "北海道-03月-HKG"
    origin: HKG
    destination: CTS
    depart_date: "2027-03-01"
    return_date: "2027-03-31"
    window_days: 0
    min_trip_days: 4
    max_trip_span_days: 5
    require_weekend: true
    no_thailand: true
    group: hokkaido
    scan_start: "2027-03-01"
    scan_end: "2027-03-31"
    max_return_date: "2027-04-05"
